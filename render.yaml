# MunLink Zambales - Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
#
# Three services deploy from this repo:
#   1. munlink-api    - Flask API (Docker)         -> https://munlink-api-5s9w.onrender.com
#   2. munlink-zambales       - Public site (static, never sleeps)     -> https://munlink-zambales.onrender.com
#   3. munlink-zambales-admin - Admin dashboard (static, never sleeps) -> https://munlink-zambales-admin.onrender.com
#
# NOTE ON URLS: Render derives the public URL from the service name. If a name is
# already taken globally, Render appends a random suffix (e.g. munlink-api-a1b2).
# If that happens, update the hardcoded URLs below (VITE_API_URL, WEB_URL, etc.)
# to match the real URLs, then redeploy.
#
# Secrets marked "sync: false" are NOT stored in git - Render prompts for them in
# the dashboard on first deploy. Keys marked "generateValue: true" are generated by
# Render automatically.

services:
  # ---------------------------------------------------------------------------
  # 1. API (Flask + gunicorn + notification worker)
  # ---------------------------------------------------------------------------
  - type: web
    name: munlink-api
    runtime: docker
    repo: https://github.com/itszoriel/Munlink-reg-3   # update if your remote differs
    region: singapore            # closest Render region to the Philippines
    plan: free                # free plan SLEEPS after 15 idle min; supabase/keep_alive.sql pings it every 10 min
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: DEBUG
        value: "False"
      # --- Secrets (set in dashboard) ---
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: munlink-files
      - key: SUPABASE_PRIVATE_BUCKET
        value: munlinkprivate-files
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- Cross-service URLs (used for CORS, cookies, email links, QR codes) ---
      - key: WEB_URL
        value: https://munlink-zambales.onrender.com
      - key: ADMIN_URL
        value: https://munlink-zambales-admin.onrender.com
      - key: BASE_URL
        value: https://munlink-api-5s9w.onrender.com
      - key: QR_BASE_URL
        value: https://munlink-zambales.onrender.com/verify
      - key: CORS_ALLOWED_ORIGINS
        # Old Docker URLs stay allowed until those services are deleted.
        value: https://munlink-zambales.onrender.com,https://munlink-zambales-admin.onrender.com,https://munlink-web-9s3r.onrender.com,https://munlink-admin-pk8j.onrender.com
      # --- Auth cookies (cross-site: web/admin -> api) ---
      - key: JWT_COOKIE_SECURE
        value: "True"
      - key: JWT_COOKIE_SAMESITE
        value: None
      # --- Misc ---
      - key: SMS_PROVIDER
        value: disabled
      - key: SMS_MAINTENANCE_MODE
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: memory://          # single instance only; use Redis if you scale replicas
      # Render's proxy sits in front of the API: trust one hop so rate limits and
      # audit logs see the real client IP instead of the proxy address.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ID_RETENTION_DAYS
        value: "30"
      # Shared secret for /internal/* (pg_cron). Same value as Supabase Vault
      # secret munlink_internal_cron_secret; see supabase/notification_cron.sql.
      - key: INTERNAL_CRON_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # 2 + 3. Web and admin as Render STATIC SITES: served from Render's CDN, they
  # never sleep and use no free instance-hours (only the API counts toward 750 h).
  # ---------------------------------------------------------------------------
  - type: web
    name: munlink-zambales
    runtime: static
    repo: https://github.com/itszoriel/Munlink-reg-3
    buildCommand: npm ci --no-audit --no-fund && npm run build -w packages/ui && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://munlink-api-5s9w.onrender.com

  - type: web
    name: munlink-zambales-admin
    runtime: static
    repo: https://github.com/itszoriel/Munlink-reg-3
    buildCommand: npm ci --no-audit --no-fund && npm run build -w packages/ui && npm run build -w apps/admin
    staticPublishPath: apps/admin/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Baked in at build time; the admin calls the API directly (CORS allows it).
      - key: VITE_API_URL
        value: https://munlink-api-5s9w.onrender.com
      - key: VITE_PUBLIC_SITE_URL
        value: https://munlink-zambales.onrender.com
