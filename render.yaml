# MunLink Zambales - Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
#
# Three services deploy from this repo:
#   1. munlink-api    - Flask API (Docker)         -> https://munlink-api.onrender.com
#   2. munlink-web     - Public site (Docker/nginx)  -> https://munlink-web.onrender.com
#   3. munlink-admin  - Admin dashboard (Docker/nginx) -> https://munlink-admin.onrender.com
#
# NOTE ON URLS: Render derives the public URL from the service name. If a name is
# already taken globally, Render appends a random suffix (e.g. munlink-api-a1b2).
# If that happens, update the hardcoded URLs below (VITE_API_URL, WEB_URL, etc.)
# to match the real URLs, then redeploy.
#
# Secrets marked "sync: false" are NOT stored in git - Render prompts for them in
# the dashboard on first deploy. Keys marked "generateValue: true" are generated by
# Render automatically.

services:
  # ---------------------------------------------------------------------------
  # 1. API (Flask + gunicorn + notification worker)
  # ---------------------------------------------------------------------------
  - type: web
    name: munlink-api
    runtime: docker
    repo: https://github.com/itszoriel/munlink   # update if your remote differs
    region: singapore            # closest Render region to the Philippines
    plan: starter                # always-on: keeps the notification worker alive & avoids cold starts
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: DEBUG
        value: "False"
      # --- Secrets (set in dashboard) ---
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: munlink-files
      - key: SUPABASE_PRIVATE_BUCKET
        value: munlinkprivate-files
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- Cross-service URLs (used for CORS, cookies, email links, QR codes) ---
      - key: WEB_URL
        value: https://munlink-web.onrender.com
      - key: ADMIN_URL
        value: https://munlink-admin.onrender.com
      - key: BASE_URL
        value: https://munlink-api.onrender.com
      - key: QR_BASE_URL
        value: https://munlink-web.onrender.com/verify
      - key: CORS_ALLOWED_ORIGINS
        value: https://munlink-web.onrender.com,https://munlink-admin.onrender.com
      # --- Auth cookies (cross-site: web/admin -> api) ---
      - key: JWT_COOKIE_SECURE
        value: "True"
      - key: JWT_COOKIE_SAMESITE
        value: None
      # --- Misc ---
      - key: SMS_PROVIDER
        value: disabled
      - key: RATELIMIT_STORAGE_URI
        value: memory://          # single instance only; use Redis if you scale replicas
      - key: ID_RETENTION_DAYS
        value: "30"

  # ---------------------------------------------------------------------------
  # 2. Public web app (React/Vite built into static bundle, served by nginx)
  # ---------------------------------------------------------------------------
  - type: web
    name: munlink-web
    runtime: docker
    repo: https://github.com/itszoriel/munlink
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    autoDeploy: true
    envVars:
      # Baked into the bundle at build time (Render passes env vars as Docker build args).
      - key: VITE_API_URL
        value: https://munlink-api.onrender.com

  # ---------------------------------------------------------------------------
  # 3. Admin dashboard (React/Vite built into static bundle, served by nginx)
  # ---------------------------------------------------------------------------
  - type: web
    name: munlink-admin
    runtime: docker
    repo: https://github.com/itszoriel/munlink
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile.admin
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://munlink-api.onrender.com
      # Runtime nginx /api/ proxy fallback target (host only, no protocol).
      - key: API_PROXY_TARGET
        value: munlink-api.onrender.com
      # Injected at runtime into env-config.js for "view public site" links.
      - key: VITE_PUBLIC_SITE_URL
        value: https://munlink-web.onrender.com
