# Railway Configuration for MunLink Admin Dashboard
# Documentation: https://docs.railway.app/deploy/config-as-code
# IMPORTANT: Set "Root Directory" to "." (project root) in Railway dashboard

[build]
builder = "NIXPACKS"
buildCommand = "npm install --no-audit --no-fund && cd packages/ui && npm install --no-audit --no-fund && npm run build && cd ../../apps/admin && npm install --no-audit --no-fund && npm run build"

[deploy]
startCommand = "npx serve -s apps/admin/dist -l $PORT"

[staticServe]
publicPath = "apps/admin/dist"
