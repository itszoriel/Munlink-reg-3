# MunLink API - Railway Configuration
# Documentation: https://docs.railway.app/deploy/config-as-code
#
# IMPORTANT: Set these environment variables in Railway Dashboard (not in this file):
# - APP_NAME, BASE_URL, WEB_URL, ADMIN_URL, QR_BASE_URL
# - SECRET_KEY, JWT_SECRET_KEY, ADMIN_SECRET_KEY
# - DATABASE_URL (Supabase connection string)
# - SENDGRID_API_KEY, FROM_EMAIL
# - SUPABASE_URL, SUPABASE_KEY, SUPABASE_SERVICE_KEY

builder = "nixpacks"

[build]
buildCommand = "bash -lc 'cd apps/api && pip install -r requirements.txt'"

[build.env]
NIXPACKS_LANGS = "python"
PYTHON_VERSION = "3.12"

[deploy]
startCommand = "bash -lc 'cd apps/api && exec gunicorn app:app --bind 0.0.0.0:${PORT:-5000} --workers 2 --timeout 120'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1