# Railway Configuration for MunLink Region 3 API
# Documentation: https://docs.railway.app/deploy/config-as-code
# Use repo root as service root so this file is picked up.

[build]
builder = "nixpacks"
buildCommand = "bash -lc \"cd apps/api && pip install -r requirements.txt\""

[build.env]
# Force Nixpacks to select Python (monorepo defaults to Node otherwise)
NIXPACKS_LANGS = "python"
PYTHON_VERSION = "3.12"

[env]
# Display name used by the API/frontends
APP_NAME = "Serbisyo Zambaleño"
# Keep startup independent of the database so healthcheck stays green
AUTO_MIGRATE = "false"
# Run migrations manually or set RUN_MIGRATIONS=true when needed
RUN_MIGRATIONS = "false"

[deploy]
# Start command: only run migrations when explicitly requested so startup isn't blocked by the DB
startCommand = "bash -lc 'cd apps/api && if [ \"${RUN_MIGRATIONS:-false}\" = \"true\" ]; then FLASK_APP=app:create_app flask db upgrade || echo \"migrations failed - continuing to start\" >&2; fi; exec gunicorn app:app --bind 0.0.0.0:${PORT:-5000} --workers 2 --timeout 120'"

# Health check configuration
healthcheckPath = "/health"
healthcheckTimeout = 100

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Number of instances (free tier = 1)
numReplicas = 1
