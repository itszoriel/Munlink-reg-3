# Railway Configuration for MunLink Region 3 API
# Documentation: https://docs.railway.app/deploy/config-as-code
# IMPORTANT: Set "Root Directory" to "apps/api" in Railway dashboard for each service

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Start command (migrations run in Dockerfile CMD)
startCommand = "flask db upgrade && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"

# Health check configuration
healthcheckPath = "/health"
healthcheckTimeout = 100

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Number of instances (free tier = 1)
numReplicas = 1

